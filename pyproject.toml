[build-system]
requires = ["setuptools>=68.0.0", "wheel", "cmake>=3.22.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-exec-vm"
version = "0.1.0"
description = "A production-grade Python execution virtual machine with optimized C/C++ extensions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
]

[tool.setuptools]
packages = ["py_exec_vm"]

[tool.setuptools.extension-builders]
# If you have a C/C++ extension module, configure it via CMake or setuptools.
# Here we provide a robust setup that gracefully handles missing source directories.

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.poe.tasks]
all = ["clean", "build", "test", "benchmark"]

[tool.poe.tasks.build]
shell = """
if [ -f "CMakeLists.txt" ]; then
    echo "Building via CMake..."
    mkdir -p build && cd build
    cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -Wall -Wextra" -DCMAKE_C_FLAGS="-O3 -Wall -Wextra" ..
    cmake --build . --config Release
else
    echo "No CMakeLists.txt found, falling back to setuptools build..."
    python -m build
fi
"""

[tool.poe.tasks.test]
shell = """
if [ -d "tests" ]; then
    echo "Running tests..."
    pytest
else
    echo "No 'tests' directory found. Skipping tests."
fi
"""

[tool.poe.tasks.benchmark]
shell = """
if [ -d "benchmarks" ]; then
    echo "Running benchmarks..."
    pytest benchmarks/
elif python -c "import pytest_benchmark" 2>/dev/null; then
    echo "Running benchmark tests via pytest..."
    pytest --benchmark-only
else
    echo "No 'benchmarks' directory or benchmark plugin found. Skipping."
fi
"""

[tool.poe.tasks.clean]
shell = """
echo "Cleaning build artifacts..."
rm -rf build/ dist/ *.egg-info .pytest_cache/ __pycache__/
find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
find . -type f -name "*.pyc" -delete 2>/dev/null || true
find . -type f -name "*.so" -delete 2>/dev/null || true
find . -type f -name "*.pyd" -delete 2>/dev/null || true
"""